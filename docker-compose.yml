version: "3.9"

services:
  db:
    image: postgres:15
    container_name: ans-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ans_db}
    ports:
      - "5440:5432"
    volumes:
      - ./sql/ans_postgresql.sql:/docker-entrypoint-initdb.d/ans_postgresql.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ans_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: ans-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/ans_db}
    ports:
      - "8085:8085"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
